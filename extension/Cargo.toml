[package]
name = "git-hf"
description = "ghf client: high-frequency checkpoints for AI agents, run as `ghf` or `git hf`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
name = "git_hf"
path = "src/lib.rs"

[[bin]]
name = "git-hf"
path = "src/bin/git-hf.rs"

# The same program under its standalone name.
[[bin]]
name = "ghf"
path = "src/bin/ghf.rs"

[dependencies]
ghf-proto.workspace = true
clap.workspace = true
serde_json.workspace = true
serde.workspace = true
blake3.workspace = true
rusqlite.workspace = true
toml.workspace = true
ureq.workspace = true
ignore.workspace = true
similar.workspace = true
humantime.workspace = true
notify.workspace = true

[lints]
workspace = true
